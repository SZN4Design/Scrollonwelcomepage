<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4E392C" />
  <title>SZN4.Design — Scroll Hero</title>

  <!-- Matching the portfolio direction: DM Sans + Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
  <main class="scroll-stage" aria-label="SZN4 Design introduction">

    <section class="zoom-line eyebrow" data-max-scale="1.10">
      <div class="line-inner">WELCOME TO MY CORNER OF THE INTERNET</div>
    </section>

    <section class="zoom-line eyebrow" data-max-scale="1.12">
      <div class="line-inner">HI, I'M SABRINA</div>
    </section>

    <section class="zoom-line statement" data-max-scale="1.12">
      <div class="line-inner">I design digital experiences around how people actually behave.</div>
    </section>

    <section class="zoom-line disciplines" data-max-scale="1.10">
      <div class="line-inner">UX/UI <span>·</span> ECOMMERCE <span>·</span> CRO <span>·</span> PRODUCT DESIGN</div>
    </section>

    <section class="zoom-line circles" data-max-scale="1.14" aria-label="Social links placeholder">
      <div class="line-inner" aria-hidden="true">
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
      </div>
    </section>

    <section class="zoom-line eyebrow final-line" data-max-scale="1.10">
      <div class="line-inner">CURRENTLY IN: SZN4</div>
    </section>

  </main>


  <script src="script.js"></script>
</body>
</html>
